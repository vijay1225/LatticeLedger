<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Violet-Magenta-Cyan Gradient -->
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="luminaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE SYMBOL - NO BACKGROUND BOX -->

  <!-- Thick 42px Infinity Lattice Ribbon -->
  <path d="M 256 256 
           C 324 140, 464 128, 464 256 
           C 464 384, 324 372, 256 256 
           C 188 140, 48 128, 48 256 
           C 48 384, 188 372, 256 256 Z" 
        fill="none" 
        stroke="url(#luminaGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#luminaGlow)"/>

  <!-- Vertical Knowledge Lattice Bars across loops -->
  <line x1="135" y1="195" x2="135" y2="317" stroke="#00f2fe" stroke-width="18" stroke-linecap="round"/>
  <line x1="377" y1="195" x2="377" y2="317" stroke="#ec4899" stroke-width="18" stroke-linecap="round"/>

  <!-- Prominent Vertex Nodes (Pure White Cores) -->
  <circle cx="48" cy="256" r="30" fill="#ffffff" stroke="#00f2fe" stroke-width="8"/>
  <circle cx="464" cy="256" r="30" fill="#ffffff" stroke="#f43f5e" stroke-width="8"/>
  <circle cx="135" cy="195" r="22" fill="#ffffff" stroke="#8b5cf6" stroke-width="6"/>
  <circle cx="135" cy="317" r="22" fill="#ffffff" stroke="#8b5cf6" stroke-width="6"/>
  <circle cx="377" cy="195" r="22" fill="#ffffff" stroke="#ec4899" stroke-width="6"/>
  <circle cx="377" cy="317" r="22" fill="#ffffff" stroke="#ec4899" stroke-width="6"/>

  <!-- Central Nexus Core -->
  <circle cx="256" cy="256" r="42" fill="#ffffff" stroke="#8b5cf6" stroke-width="10" filter="url(#luminaGlow)"/>
  <circle cx="256" cy="256" r="18" fill="#8b5cf6"/>
</svg>
