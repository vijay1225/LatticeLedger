<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Azure Left Page -->
    <linearGradient id="qPageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Hot Coral to Magenta Right Page -->
    <linearGradient id="qPageRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE SYMBOL - NO BOX -->

  <!-- Left Ledger Wing -->
  <polygon points="68,140 236,200 236,430 68,370" fill="url(#qPageLeft)" opacity="0.95"/>

  <!-- Right Ledger Wing -->
  <polygon points="444,140 276,200 276,430 444,370" fill="url(#qPageRight)" opacity="0.95"/>

  <!-- Central Ascending Neural Lattice Spine -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" filter="url(#qGlow)">
    <line x1="256" y1="52" x2="256" y2="460" stroke-width="18" stroke="#ffffff"/>
    <line x1="152" y1="240" x2="256" y2="190" stroke-width="14" stroke="#00f2fe"/>
    <line x1="360" y1="240" x2="256" y2="190" stroke-width="14" stroke="#ff2d55"/>
    <line x1="152" y1="310" x2="256" y2="360" stroke-width="14" stroke="#00f2fe"/>
    <line x1="360" y1="310" x2="256" y2="360" stroke-width="14" stroke="#ff2d55"/>
  </g>

  <!-- Radiant Apex Beacon Node (AI Synthesis) -->
  <circle cx="256" cy="52" r="34" fill="#ffffff" stroke="#00f2fe" stroke-width="8" filter="url(#qGlow)"/>
  <circle cx="256" cy="52" r="16" fill="#00f2fe"/>

  <!-- Wing Nodes -->
  <circle cx="152" cy="240" r="24" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
  <circle cx="360" cy="240" r="24" fill="#ffffff" stroke="#ff2d55" stroke-width="6"/>
  <circle cx="152" cy="310" r="24" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
  <circle cx="360" cy="310" r="24" fill="#ffffff" stroke="#ff2d55" stroke-width="6"/>

  <!-- Bottom Anchor Node -->
  <circle cx="256" cy="460" r="26" fill="#ffffff" stroke="#d946ef" stroke-width="6"/>
</svg>
