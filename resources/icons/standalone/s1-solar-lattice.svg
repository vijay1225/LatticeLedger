<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Solar Amber to Coral Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Node Glow Gradient -->
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <filter id="solarGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE SYMBOL - NO BACKGROUND BOX / NO SQUIRCLE -->

  <!-- Outer Hexagonal Lattice Frame - Thick 36px Stroke -->
  <g stroke="url(#solarGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#solarGlow)">
    <polygon points="256,48 436,152 436,360 256,464 76,360 76,152" fill="none"/>
    <!-- Connecting Inward Lattice Spokes -->
    <line x1="256" y1="48" x2="256" y2="256"/>
    <line x1="436" y1="152" x2="256" y2="256"/>
    <line x1="436" y1="360" x2="256" y2="256"/>
    <line x1="256" y1="464" x2="256" y2="256"/>
    <line x1="76" y1="360" x2="256" y2="256"/>
    <line x1="76" y1="152" x2="256" y2="256"/>
  </g>

  <!-- High-Luminance Vertex Nodes (Visible at 24px) -->
  <circle cx="256" cy="48" r="32" fill="#ffffff" stroke="#f59e0b" stroke-width="8"/>
  <circle cx="436" cy="152" r="30" fill="#fef08a" stroke="#ff5722" stroke-width="8"/>
  <circle cx="436" cy="360" r="30" fill="#fef08a" stroke="#ff5722" stroke-width="8"/>
  <circle cx="256" cy="464" r="32" fill="#fef08a" stroke="#e11d48" stroke-width="8"/>
  <circle cx="76" cy="360" r="30" fill="#fef08a" stroke="#ff5722" stroke-width="8"/>
  <circle cx="76" cy="152" r="30" fill="#fef08a" stroke="#ff5722" stroke-width="8"/>

  <!-- Radiant Central Neural Core (AI Sun) -->
  <circle cx="256" cy="256" r="48" fill="url(#sunCore)" stroke="#ffffff" stroke-width="8" filter="url(#solarGlow)"/>
</svg>
