<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Flame Gradient: Ruby to Tangerine to Gold -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE KNOT SYMBOL - NO BOX -->

  <!-- Interlocking Double Geometric Diamond / Knot -->
  <g stroke="url(#flameGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#flameGlow)">
    <!-- Primary Diamond -->
    <polygon points="256,52 444,240 256,428 68,240"/>
    <!-- Interlocking Inner Loop -->
    <path d="M 256 130 L 366 240 L 256 350 L 146 240 Z" stroke-width="26" stroke="#fbbf24"/>
    <!-- Cross Interconnections -->
    <line x1="256" y1="52" x2="256" y2="428" stroke-width="20" stroke="#ffffff"/>
    <line x1="68" y1="240" x2="444" y2="240" stroke-width="20" stroke="#ffffff"/>
  </g>

  <!-- 4 Radiant Cardinal Nodes -->
  <circle cx="256" cy="52" r="32" fill="#ffffff" stroke="#ef4444" stroke-width="8"/>
  <circle cx="444" cy="240" r="32" fill="#ffffff" stroke="#f97316" stroke-width="8"/>
  <circle cx="256" cy="428" r="32" fill="#ffffff" stroke="#fbbf24" stroke-width="8"/>
  <circle cx="68" cy="240" r="32" fill="#ffffff" stroke="#ef4444" stroke-width="8"/>

  <!-- Radiant Central Knowledge Flare -->
  <circle cx="256" cy="240" r="44" fill="#ffffff" stroke="#f97316" stroke-width="10" filter="url(#flameGlow)"/>
  <circle cx="256" cy="240" r="18" fill="#f97316"/>
</svg>
