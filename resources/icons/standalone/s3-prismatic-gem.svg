<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients: Bright Violet, Royal Blue, Neon Cyan -->
    <linearGradient id="facetTopV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="facetLeftV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="facetRightV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <filter id="gemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE FACETED CRYSTAL GLYPH - NO BOX -->

  <!-- Top Prism Face -->
  <polygon points="256,40 436,160 256,260 76,160" fill="url(#facetTopV)" opacity="0.95"/>
  <!-- Left Bottom Prism Face -->
  <polygon points="76,160 256,260 256,472 150,380" fill="url(#facetLeftV)" opacity="0.95"/>
  <!-- Right Bottom Prism Face -->
  <polygon points="436,160 256,260 256,472 362,380" fill="url(#facetRightV)" opacity="0.95"/>

  <!-- Thick White & Neon Edge Lattice Struts -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#gemGlow)">
    <polygon points="256,40 436,160 256,472 76,160" fill="none" stroke-width="14"/>
    <!-- Central Ridge & Cross Lattice -->
    <line x1="256" y1="40" x2="256" y2="472" stroke-width="16" stroke="#ffffff"/>
    <line x1="76" y1="160" x2="436" y2="160" stroke-width="14" stroke="#e0e7ff"/>
  </g>

  <!-- High-Luminance Nodes at Vertices -->
  <circle cx="256" cy="40" r="30" fill="#ffffff" stroke="#38bdf8" stroke-width="8" filter="url(#gemGlow)"/>
  <circle cx="76" cy="160" r="28" fill="#ffffff" stroke="#c084fc" stroke-width="7"/>
  <circle cx="436" cy="160" r="28" fill="#ffffff" stroke="#ec4899" stroke-width="7"/>
  <circle cx="256" cy="260" r="36" fill="#ffffff" stroke="#8b5cf6" stroke-width="8" filter="url(#gemGlow)"/>
  <circle cx="256" cy="472" r="26" fill="#ffffff" stroke="#9333ea" stroke-width="7"/>
</svg>
