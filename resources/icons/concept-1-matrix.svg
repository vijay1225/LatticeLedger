<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Lattice Glow Gradient -->
    <linearGradient id="latticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ledgerPages" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Ledger / Book Spine & Silhouette in Background -->
  <path d="M 120 380 Q 256 420 392 380 L 392 240 Q 256 270 120 240 Z" fill="url(#ledgerPages)" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <path d="M 256 260 L 256 410" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Connected Lattice Edges (Wiki-links & Knowledge Graph) -->
  <g stroke="url(#latticeGrad)" stroke-width="3.5" opacity="0.85" filter="url(#neonGlow)">
    <!-- Main Diamond / Hexagonal Matrix -->
    <line x1="256" y1="90" x2="140" y2="180" />
    <line x1="256" y1="90" x2="372" y2="180" />
    <line x1="140" y1="180" x2="140" y2="310" />
    <line x1="372" y1="180" x2="372" y2="310" />
    <line x1="140" y1="310" x2="256" y2="380" />
    <line x1="372" y1="310" x2="256" y2="380" />

    <!-- Cross Interconnections (The Lattice / Zettelkasten web) -->
    <line x1="256" y1="90" x2="256" y2="230" stroke-width="4"/>
    <line x1="140" y1="180" x2="256" y2="230" />
    <line x1="372" y1="180" x2="256" y2="230" />
    <line x1="140" y1="310" x2="256" y2="230" />
    <line x1="372" y1="310" x2="256" y2="230" />
    <line x1="256" y1="230" x2="256" y2="380" stroke-width="4"/>

    <!-- Auxiliary Satellite Nodes (Quick Notes Orbiting Hub) -->
    <line x1="140" y1="180" x2="85" y2="230" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="372" y1="180" x2="425" y2="230" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="140" y1="310" x2="95" y2="350" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="372" y1="310" x2="415" y2="350" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Orbiting Quick Note Satellite Nodes -->
  <circle cx="85" cy="230" r="7" fill="#38bdf8" opacity="0.8"/>
  <circle cx="425" cy="230" r="7" fill="#38bdf8" opacity="0.8"/>
  <circle cx="95" cy="350" r="6" fill="#10b981" opacity="0.8"/>
  <circle cx="415" cy="350" r="6" fill="#10b981" opacity="0.8"/>

  <!-- Primary Wiki Page Hub Nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Top Apex Node -->
    <circle cx="256" cy="90" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Left Mid Node -->
    <circle cx="140" cy="180" r="12" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
    <!-- Right Mid Node -->
    <circle cx="372" cy="180" r="12" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
    <!-- Left Bottom Node -->
    <circle cx="140" cy="310" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <!-- Right Bottom Node -->
    <circle cx="372" cy="310" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <!-- Bottom Anchor Node -->
    <circle cx="256" cy="380" r="13" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Central AI Neural Core (Heart of LatticeLedger) -->
    <circle cx="256" cy="230" r="22" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="230" r="10" fill="#ffffff"/>
  </g>
</svg>
