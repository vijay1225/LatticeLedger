<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hexBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#hexBg)" stroke="#1f2937" stroke-width="3"/>

  <!-- 3D Isometric Isometric Prism -->
  <g filter="url(#prismGlow)">
    <!-- Top Face (Knowledge Graph Lattice Plane) -->
    <polygon points="256,90 392,168 256,246 120,168" fill="url(#topFacet)" opacity="0.95"/>

    <!-- Left Face (Structured Wiki Ledger Pages) -->
    <polygon points="120,168 256,246 256,402 120,324" fill="url(#leftFacet)" opacity="0.9"/>

    <!-- Right Face (AI Synthesis & Flashcard Matrix) -->
    <polygon points="256,246 392,168 392,324 256,402" fill="url(#rightFacet)" opacity="0.9"/>

    <!-- Prism Crisp Edges -->
    <line x1="256" y1="90" x2="256" y2="246" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="256" y1="246" x2="120" y2="168" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="256" y1="246" x2="392" y2="168" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="256" y1="246" x2="256" y2="402" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Top Face: Connected Knowledge Lattice Pattern -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="256" y1="130" x2="188" y2="168"/>
    <line x1="256" y1="130" x2="324" y2="168"/>
    <line x1="188" y1="168" x2="256" y2="206"/>
    <line x1="324" y1="168" x2="256" y2="206"/>
    <circle cx="256" cy="130" r="5" fill="#ffffff"/>
    <circle cx="188" cy="168" r="5" fill="#ffffff"/>
    <circle cx="324" cy="168" r="5" fill="#ffffff"/>
    <circle cx="256" cy="206" r="6" fill="#fbbf24"/>
  </g>

  <!-- Left Face: Ledger Ruled Lines & Checklist -->
  <g stroke="#a7f3d0" stroke-width="2.5" opacity="0.6">
    <line x1="145" y1="220" x2="230" y2="268"/>
    <line x1="145" y1="255" x2="230" y2="303"/>
    <line x1="145" y1="290" x2="210" y2="328"/>
  </g>

  <!-- Right Face: Flashcard / Brain Wave Node Connections -->
  <g stroke="#c7d2fe" stroke-width="2" opacity="0.6">
    <line x1="282" y1="268" x2="367" y2="220"/>
    <line x1="282" y1="303" x2="367" y2="255"/>
    <circle cx="324" cy="285" r="5" fill="#ffffff"/>
    <circle cx="350" cy="310" r="4" fill="#a5b4fc"/>
  </g>

  <!-- Outer Orbiting Spark Nodes -->
  <circle cx="90" cy="130" r="7" fill="#38bdf8" opacity="0.85"/>
  <circle cx="422" cy="130" r="7" fill="#818cf8" opacity="0.85"/>
  <circle cx="256" cy="445" r="8" fill="#10b981" opacity="0.85"/>
</svg>
