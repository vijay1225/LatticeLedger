<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="l2Grad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#darkBg)" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Background Subtle Grid / Graph Coordinate Lattice -->
  <g stroke="#27272a" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6">
    <line x1="120" y1="60" x2="120" y2="452"/>
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="392" y1="60" x2="392" y2="452"/>
    <line x1="60" y1="120" x2="452" y2="120"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <line x1="60" y1="392" x2="452" y2="392"/>
  </g>

  <!-- Connected Graph Constellation Web behind letters -->
  <g stroke="#3f3f46" stroke-width="2" opacity="0.5">
    <line x1="150" y1="130" x2="256" y2="90"/>
    <line x1="256" y1="90" x2="362" y2="130"/>
    <line x1="362" y1="130" x2="390" y2="256"/>
    <line x1="390" y1="256" x2="362" y2="382"/>
    <line x1="362" y1="382" x2="256" y2="422"/>
    <line x1="256" y1="422" x2="150" y2="382"/>
    <line x1="150" y1="382" x2="122" y2="256"/>
    <line x1="122" y1="256" x2="150" y2="130"/>
  </g>

  <!-- Interlocking Double-L Monogram -->
  <!-- Primary L (Lattice) - Ascending upright from left down to bottom-right -->
  <path d="M 175 110 
           L 215 110 
           L 215 320 
           L 355 320 
           L 355 360 
           L 175 360 Z" 
        fill="url(#l1Grad)" 
        filter="url(#softGlow)"/>

  <!-- Secondary Interlocking L (Ledger) - Rotated/Inverted from right up to top-left -->
  <path d="M 337 402 
           L 297 402 
           L 297 192 
           L 157 192 
           L 157 152 
           L 337 152 Z" 
        fill="url(#l2Grad)" 
        opacity="0.9"
        filter="url(#softGlow)"/>

  <!-- Overlapping Central Intersect Diamond Accent -->
  <polygon points="256,220 297,256 256,292 215,256" fill="#ffffff" opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="6" fill="#10b981"/>

  <!-- Corner Knowledge Graph Nodes -->
  <circle cx="175" cy="110" r="10" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
  <circle cx="355" cy="360" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="337" cy="402" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="157" cy="152" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
</svg>
