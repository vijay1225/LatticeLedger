<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="infBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#infBg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Thick Geometric Infinity Lattice Loop -->
  <path d="M 256 256 
           C 310 180, 420 170, 420 256 
           C 420 342, 310 332, 256 256 
           C 202 180, 92 170, 92 256 
           C 92 342, 202 332, 256 256 Z" 
        fill="none" 
        stroke="url(#infGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow2)"/>

  <!-- Interconnecting Lattice Spokes across the loops -->
  <line x1="165" y1="210" x2="165" y2="302" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="347" y1="210" x2="347" y2="302" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Prominent Vertices (Nodes) -->
  <!-- Left Loop Nodes (Quick Notes Hub) -->
  <circle cx="92" cy="256" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="5"/>
  <circle cx="165" cy="210" r="18" fill="#0ea5e9" stroke="#ffffff" stroke-width="4"/>
  <circle cx="165" cy="302" r="18" fill="#0ea5e9" stroke="#ffffff" stroke-width="4"/>

  <!-- Right Loop Nodes (Wiki Pages Hub) -->
  <circle cx="420" cy="256" r="22" fill="#34d399" stroke="#ffffff" stroke-width="5"/>
  <circle cx="347" cy="210" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="347" cy="302" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4"/>

  <!-- Central Nexus Node (The AI Interlock) -->
  <circle cx="256" cy="256" r="30" fill="#10b981" stroke="#ffffff" stroke-width="6" filter="url(#glow2)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
