<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="deltaBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="deltaBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="deltaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#deltaBg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Thick Delta Struts (The Core Tri-Lattice) -->
  <g stroke="url(#deltaBeam)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#deltaGlow)">
    <!-- Outer Delta Triangle -->
    <polygon points="256,96 398,370 114,370" fill="none"/>
    <!-- Inward Spokes to AI Core -->
    <line x1="256" y1="96" x2="256" y2="278"/>
    <line x1="398" y1="370" x2="256" y2="278"/>
    <line x1="114" y1="370" x2="256" y2="278"/>
  </g>

  <!-- 3 Prominent Planetary Vertex Hubs -->
  <!-- Top Hub (Wiki Pages Evergreen) -->
  <circle cx="256" cy="96" r="30" fill="#38bdf8" stroke="#ffffff" stroke-width="6"/>
  <!-- Right Hub (AI Synthesis & Insights) -->
  <circle cx="398" cy="370" r="28" fill="#34d399" stroke="#ffffff" stroke-width="6"/>
  <!-- Left Hub (Quick Notes & Scratchpad) -->
  <circle cx="114" cy="370" r="28" fill="#0ea5e9" stroke="#ffffff" stroke-width="6"/>

  <!-- Central Radiant AI Core Node -->
  <circle cx="256" cy="278" r="36" fill="#10b981" stroke="#ffffff" stroke-width="7" filter="url(#deltaGlow)"/>
  <circle cx="256" cy="278" r="14" fill="#ffffff"/>
</svg>
