<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="wingBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#wingBg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Left Ledger Wing (Clean Geometric Polygon) -->
  <polygon points="100,160 236,210 236,370 100,320" fill="url(#leftWing)" opacity="0.95"/>

  <!-- Right Ledger Wing (Clean Geometric Polygon) -->
  <polygon points="412,160 276,210 276,370 412,320" fill="url(#rightWing)" opacity="0.95"/>

  <!-- Central Glowing Lattice Spine & Ascending Apex -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#glow3)">
    <line x1="256" y1="120" x2="256" y2="390" stroke-width="10" stroke="#38bdf8"/>
    <!-- Cross Struts Linking Wings -->
    <line x1="168" y1="240" x2="256" y2="200" stroke="#38bdf8"/>
    <line x1="344" y1="240" x2="256" y2="200" stroke="#10b981"/>
    <line x1="168" y1="290" x2="256" y2="330" stroke="#38bdf8"/>
    <line x1="344" y1="290" x2="256" y2="330" stroke="#10b981"/>
  </g>

  <!-- Bright Apex Node (AI Beacon) -->
  <circle cx="256" cy="120" r="28" fill="#38bdf8" stroke="#ffffff" stroke-width="6" filter="url(#glow3)"/>
  <circle cx="256" cy="120" r="12" fill="#ffffff"/>

  <!-- Wing Nodes -->
  <circle cx="168" cy="240" r="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
  <circle cx="344" cy="240" r="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <circle cx="168" cy="290" r="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
  <circle cx="344" cy="290" r="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>

  <!-- Base Anchor Node -->
  <circle cx="256" cy="390" r="20" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
</svg>
