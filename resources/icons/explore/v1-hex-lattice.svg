<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hexBg1" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="rim1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#hexBg1)" stroke="url(#rim1)" stroke-width="4"/>

  <!-- Thick, Bold Hexagonal Lattice Structure -->
  <g stroke="url(#beam1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)">
    <!-- Outer Hexagon Perimeter -->
    <polygon points="256,90 396,170 396,342 256,422 116,342 116,170" fill="none"/>
    <!-- Central Spokes (Interconnecting Lattice to Core) -->
    <line x1="256" y1="90" x2="256" y2="256"/>
    <line x1="396" y1="170" x2="256" y2="256"/>
    <line x1="396" y1="342" x2="256" y2="256"/>
    <line x1="256" y1="422" x2="256" y2="256"/>
    <line x1="116" y1="342" x2="256" y2="256"/>
    <line x1="116" y1="170" x2="256" y2="256"/>
  </g>

  <!-- Bold Connection Nodes (Vertices) -->
  <circle cx="256" cy="90" r="24" fill="#38bdf8" stroke="#ffffff" stroke-width="5"/>
  <circle cx="396" cy="170" r="22" fill="#0ea5e9" stroke="#ffffff" stroke-width="5"/>
  <circle cx="396" cy="342" r="22" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
  <circle cx="256" cy="422" r="24" fill="#059669" stroke="#ffffff" stroke-width="5"/>
  <circle cx="116" cy="342" r="22" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
  <circle cx="116" cy="170" r="22" fill="#0ea5e9" stroke="#ffffff" stroke-width="5"/>

  <!-- Central AI Neural Core -->
  <circle cx="256" cy="256" r="36" fill="#10b981" stroke="#ffffff" stroke-width="6" filter="url(#glow1)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
