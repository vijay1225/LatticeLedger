<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luminous Glow Filters -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="pencilWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- STANDALONE ICON - 100% TRANSPARENT BACKGROUND FOR TASKBAR/TASK MANAGER -->

  <!-- Subtle Outer Shadow / Contrast Shield (Guarantees Visibility on Light & Dark Backgrounds) -->
  <path d="M 256 46 L 438 151 L 438 361 L 256 466 L 74 361 L 74 151 Z" 
        stroke="rgba(0,0,0,0.6)" stroke-width="26" fill="none" stroke-linejoin="round"/>

  <!-- 1. Outer Hexagonal Lattice Frame -->
  <path d="M 256 46 L 438 151 L 438 361 L 256 466 L 74 361 L 74 151 Z" 
        stroke="url(#cyanGrad)" 
        stroke-width="18" 
        fill="none" 
        stroke-linejoin="round"
        filter="url(#neonCyanGlow)"/>

  <!-- Orbital Flow Ring -->
  <circle cx="256" cy="256" r="142" 
          stroke="rgba(0, 242, 254, 0.3)" 
          stroke-width="4" 
          stroke-dasharray="10 8" 
          fill="none"/>

  <!-- Hexagonal Vertex Ripple Nodes -->
  <!-- Top (256, 46) -->
  <circle cx="256" cy="46" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="256" cy="46" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>

  <!-- Top-Right (438, 151) -->
  <circle cx="438" cy="151" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="438" cy="151" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>

  <!-- Bottom-Right (438, 361) -->
  <circle cx="438" cy="361" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="438" cy="361" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>

  <!-- Bottom (256, 466) -->
  <circle cx="256" cy="466" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="256" cy="466" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>

  <!-- Bottom-Left (74, 361) -->
  <circle cx="74" cy="361" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="74" cy="361" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>

  <!-- Top-Left (74, 151) -->
  <circle cx="74" cy="151" r="28" stroke="rgba(0, 242, 254, 0.4)" stroke-width="3" fill="none"/>
  <circle cx="74" cy="151" r="18" fill="#ffffff" stroke="#00f2fe" stroke-width="5" filter="url(#neonCyanGlow)"/>


  <!-- 2. Three Stylized Orbiting Pencils -->
  
  <!-- Pencil 1: Top-Left (angled ~35 deg) -->
  <g transform="translate(190, 160) rotate(-35)">
    <!-- Eraser -->
    <path d="M -45 -11 C -53 -11, -55 11, -45 11 Z" fill="#f43f5e"/>
    <!-- Ferrule -->
    <rect x="-44" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <!-- Body -->
    <rect x="-34" y="-11" width="56" height="22" fill="url(#pencilWood)" rx="2"/>
    <line x1="-34" y1="-3" x2="22" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <line x1="-34" y1="4" x2="22" y2="4" stroke="#d97706" stroke-width="3"/>
    <!-- Collar & Tip -->
    <polygon points="22,-11 44,0 22,11" fill="#fed7aa"/>
    <polygon points="34,-5 44,0 34,5" fill="#1e293b"/>
  </g>

  <!-- Pencil 2: Right (vertical, pointing down) -->
  <g transform="translate(345, 256) rotate(90)">
    <!-- Eraser -->
    <path d="M -50 -11 C -58 -11, -60 11, -50 11 Z" fill="#f43f5e"/>
    <!-- Ferrule -->
    <rect x="-49" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <!-- Body -->
    <rect x="-39" y="-11" width="62" height="22" fill="url(#pencilWood)" rx="2"/>
    <line x1="-39" y1="-3" x2="23" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <line x1="-39" y1="4" x2="23" y2="4" stroke="#d97706" stroke-width="3"/>
    <!-- Collar & Tip -->
    <polygon points="23,-11 47,0 23,11" fill="#fed7aa"/>
    <polygon points="36,-5 47,0 36,5" fill="#1e293b"/>
  </g>

  <!-- Pencil 3: Bottom-Left (angled ~35 deg) -->
  <g transform="translate(190, 350) rotate(35)">
    <!-- Tip pointing up-left -->
    <polygon points="-47,0 -23,-11 -23,11" fill="#fed7aa"/>
    <polygon points="-47,0 -36,-5 -36,5" fill="#1e293b"/>
    <!-- Body -->
    <rect x="-23" y="-11" width="62" height="22" fill="url(#pencilWood)" rx="2"/>
    <line x1="-23" y1="-3" x2="39" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <line x1="-23" y1="4" x2="39" y2="4" stroke="#d97706" stroke-width="3"/>
    <!-- Ferrule -->
    <rect x="39" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <!-- Eraser -->
    <path d="M 49 -11 C 57 -11, 59 11, 49 11 Z" fill="#f43f5e"/>
  </g>


  <!-- 3. Central L Monogram: The Lattice + Ledger Intertwined Heart -->
  
  <!-- Lattice L (Rigid Node-and-Stick Skeleton) -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Stem -->
    <line x1="228" y1="195" x2="228" y2="312" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <!-- Horizontal Foot -->
    <line x1="228" y1="312" x2="288" y2="312" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Three Lattice Nodes -->
    <circle cx="228" cy="195" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="228" cy="312" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="288" cy="312" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <!-- Ledger Cursive L Loop (Weaves through the Lattice L) -->
  <path d="M 218 268 
           C 255 268, 290 250, 292 205 
           C 294 175, 268 175, 252 200 
           C 236 225, 230 270, 254 312" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#goldGlow)"/>

  <!-- High-Luminance White Center Core for the Loop -->
  <path d="M 218 268 
           C 255 268, 290 250, 292 205 
           C 294 175, 268 175, 252 200 
           C 236 225, 230 270, 254 312" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"/>

</svg>
