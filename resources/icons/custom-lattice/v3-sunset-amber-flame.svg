<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="flameHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="warmLoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- STANDALONE ICON - 100% TRANSPARENT CANVAS -->

  <!-- Subtle Dark Occlusion Shadow -->
  <path d="M 256 46 L 438 151 L 438 361 L 256 466 L 74 361 L 74 151 Z" 
        stroke="rgba(0,0,0,0.6)" stroke-width="26" fill="none" stroke-linejoin="round"/>

  <!-- 1. Flame Gradient Hexagon -->
  <path d="M 256 46 L 438 151 L 438 361 L 256 466 L 74 361 L 74 151 Z" 
        stroke="url(#flameHex)" 
        stroke-width="18" 
        fill="none" 
        stroke-linejoin="round"
        filter="url(#flameGlow)"/>

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="142" 
          stroke="rgba(245, 158, 11, 0.4)" 
          stroke-width="3" 
          stroke-dasharray="10 8" 
          fill="none"/>

  <!-- Ripple Nodes (6 Vertices) -->
  <g filter="url(#flameGlow)">
    <!-- Top -->
    <circle cx="256" cy="46" r="28" stroke="rgba(254, 240, 138, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="256" cy="46" r="18" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>

    <!-- Top-Right -->
    <circle cx="438" cy="151" r="28" stroke="rgba(245, 158, 11, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="438" cy="151" r="18" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>

    <!-- Bottom-Right -->
    <circle cx="438" cy="361" r="28" stroke="rgba(234, 88, 12, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="438" cy="361" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="5"/>

    <!-- Bottom -->
    <circle cx="256" cy="466" r="28" stroke="rgba(220, 38, 38, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="256" cy="466" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="5"/>

    <!-- Bottom-Left -->
    <circle cx="74" cy="361" r="28" stroke="rgba(234, 88, 12, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="74" cy="361" r="18" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>

    <!-- Top-Left -->
    <circle cx="74" cy="151" r="28" stroke="rgba(245, 158, 11, 0.4)" stroke-width="3" fill="none"/>
    <circle cx="74" cy="151" r="18" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <!-- 2. Orbiting Pencils (Golden Amber Finish) -->
  <g transform="translate(190, 160) rotate(-35)">
    <path d="M -45 -11 C -53 -11, -55 11, -45 11 Z" fill="#ef4444"/>
    <rect x="-44" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <rect x="-34" y="-11" width="56" height="22" fill="#f59e0b" rx="2"/>
    <line x1="-34" y1="-3" x2="22" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <polygon points="22,-11 44,0 22,11" fill="#fed7aa"/>
    <polygon points="34,-5 44,0 34,5" fill="#1e293b"/>
  </g>

  <g transform="translate(345, 256) rotate(90)">
    <path d="M -50 -11 C -58 -11, -60 11, -50 11 Z" fill="#ef4444"/>
    <rect x="-49" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <rect x="-39" y="-11" width="62" height="22" fill="#f59e0b" rx="2"/>
    <line x1="-39" y1="-3" x2="23" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <polygon points="23,-11 47,0 23,11" fill="#fed7aa"/>
    <polygon points="36,-5 47,0 36,5" fill="#1e293b"/>
  </g>

  <g transform="translate(190, 350) rotate(35)">
    <polygon points="-47,0 -23,-11 -23,11" fill="#fed7aa"/>
    <polygon points="-47,0 -36,-5 -36,5" fill="#1e293b"/>
    <rect x="-23" y="-11" width="62" height="22" fill="#f59e0b" rx="2"/>
    <line x1="-23" y1="-3" x2="39" y2="-3" stroke="#fef08a" stroke-width="3"/>
    <rect x="39" y="-11" width="10" height="22" fill="#cbd5e1" rx="2"/>
    <path d="M 49 -11 C 57 -11, 59 11, 49 11 Z" fill="#ef4444"/>
  </g>

  <!-- 3. Central L Monogram -->
  <g filter="url(#flameGlow)">
    <!-- Lattice L (White-hot core) -->
    <line x1="228" y1="195" x2="228" y2="312" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <line x1="228" y1="312" x2="288" y2="312" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    
    <circle cx="228" cy="195" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="228" cy="312" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="288" cy="312" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <!-- Ledger Cursive Loop -->
  <path d="M 218 268 
           C 255 268, 290 250, 292 205 
           C 294 175, 268 175, 252 200 
           C 236 225, 230 270, 254 312" 
        stroke="url(#warmLoop)" 
        stroke-width="14" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#flameGlow)"/>

  <path d="M 218 268 
           C 255 268, 290 250, 292 205 
           C 294 175, 268 175, 252 200 
           C 236 225, 230 270, 254 312" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"/>
</svg>
