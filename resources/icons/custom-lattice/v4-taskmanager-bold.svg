<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Crisp High-Density Neon Glow -->
    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="boldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="boldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- STANDALONE ICON - 100% TRANSPARENT CANVAS -->

  <!-- Deep Contrast Under-Stroke -->
  <path d="M 256 42 L 442 149 L 442 363 L 256 470 L 70 363 L 70 149 Z" 
        stroke="rgba(0,0,0,0.8)" stroke-width="32" fill="none" stroke-linejoin="round"/>

  <!-- 1. Heavy Hexagonal Lattice Ring (22px Stroke for Subpixel Sharpness at 16px/24px) -->
  <path d="M 256 42 L 442 149 L 442 363 L 256 470 L 70 363 L 70 149 Z" 
        stroke="url(#boldCyan)" 
        stroke-width="22" 
        fill="none" 
        stroke-linejoin="round"
        filter="url(#crispGlow)"/>

  <!-- 6 Large Luminous Corner Nodes -->
  <!-- Top -->
  <circle cx="256" cy="42" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>
  <!-- Top-Right -->
  <circle cx="442" cy="149" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>
  <!-- Bottom-Right -->
  <circle cx="442" cy="363" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>
  <!-- Bottom -->
  <circle cx="256" cy="470" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>
  <!-- Bottom-Left -->
  <circle cx="70" cy="363" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>
  <!-- Top-Left -->
  <circle cx="70" cy="149" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6" filter="url(#crispGlow)"/>


  <!-- 2. Three Punchy Stylized Pencils -->

  <!-- Top-Left Pencil -->
  <g transform="translate(185, 155) rotate(-35)">
    <!-- Eraser -->
    <path d="M -48 -13 C -56 -13, -58 13, -48 13 Z" fill="#f43f5e"/>
    <!-- Ferrule -->
    <rect x="-46" y="-13" width="12" height="26" fill="#f1f5f9" rx="2"/>
    <!-- Body -->
    <rect x="-34" y="-13" width="58" height="26" fill="#f8fafc" rx="2"/>
    <line x1="-34" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <!-- Tip -->
    <polygon points="24,-13 50,0 24,13" fill="#fed7aa"/>
    <polygon points="38,-6 50,0 38,6" fill="#0f172a"/>
  </g>

  <!-- Right Pencil -->
  <g transform="translate(345, 256) rotate(90)">
    <path d="M -54 -13 C -62 -13, -64 13, -54 13 Z" fill="#f43f5e"/>
    <rect x="-52" y="-13" width="12" height="26" fill="#f1f5f9" rx="2"/>
    <rect x="-40" y="-13" width="64" height="26" fill="#f8fafc" rx="2"/>
    <line x1="-40" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="24,-13 52,0 24,13" fill="#fed7aa"/>
    <polygon points="40,-6 52,0 40,6" fill="#0f172a"/>
  </g>

  <!-- Bottom-Left Pencil -->
  <g transform="translate(185, 355) rotate(35)">
    <polygon points="-52,0 -24,-13 -24,13" fill="#fed7aa"/>
    <polygon points="-52,0 -40,-6 -40,6" fill="#0f172a"/>
    <rect x="-24" y="-13" width="64" height="26" fill="#f8fafc" rx="2"/>
    <line x1="-24" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <rect x="40" y="-13" width="12" height="26" fill="#f1f5f9" rx="2"/>
    <path d="M 52 -13 C 60 -13, 62 13, 52 13 Z" fill="#f43f5e"/>
  </g>


  <!-- 3. Prominent Central L Monogram (High Silhouette Density) -->

  <!-- Lattice L -->
  <g filter="url(#crispGlow)">
    <line x1="225" y1="190" x2="225" y2="318" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <line x1="225" y1="318" x2="295" y2="318" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    
    <circle cx="225" cy="190" r="16" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="225" cy="318" r="16" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="295" cy="318" r="16" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
  </g>

  <!-- Ledger Cursive L Loop -->
  <path d="M 214 270 
           C 255 270, 298 250, 300 200 
           C 302 165, 272 165, 252 195 
           C 232 225, 226 274, 254 318" 
        stroke="url(#boldAmber)" 
        stroke-width="18" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#crispGlow)"/>

  <!-- High-Luminance White Center Spine -->
  <path d="M 214 270 
           C 255 270, 298 250, 300 200 
           C 302 165, 272 165, 252 195 
           C 232 225, 226 274, 254 318" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        fill="none"/>

</svg>
