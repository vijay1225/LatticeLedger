<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="60%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>

    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="glowPageLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glowPageRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#spaceBg)" stroke="#1e293b" stroke-width="3"/>

  <!-- Vertical Light Projection Beam -->
  <polygon points="256,330 140,110 372,110" fill="url(#beamGrad)" opacity="0.4"/>

  <!-- Open Digital Ledger Book at Bottom -->
  <!-- Left Page -->
  <path d="M 256 345 C 210 325 150 320 90 335 L 90 410 C 150 395 210 400 256 420 Z" 
        fill="url(#glowPageLeft)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Right Page -->
  <path d="M 256 345 C 302 325 362 320 422 335 L 422 410 C 362 395 302 400 256 420 Z" 
        fill="url(#glowPageRight)" stroke="#10b981" stroke-width="2.5"/>
  <!-- Book Spine Center -->
  <line x1="256" y1="345" x2="256" y2="420" stroke="#f8fafc" stroke-width="3"/>

  <!-- Page Lines / Markdown Ruled Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="355" x2="225" y2="345"/>
    <line x1="120" y1="375" x2="225" y2="365"/>
    <line x1="120" y1="395" x2="200" y2="385"/>
  </g>
  <g stroke="#10b981" stroke-width="1.5" opacity="0.4">
    <line x1="287" y1="345" x2="392" y2="355"/>
    <line x1="287" y1="365" x2="392" y2="375"/>
    <line x1="312" y1="385" x2="392" y2="395"/>
  </g>

  <!-- Floating Constellation / Knowledge Graph Nodes Risen Above Book -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.75" filter="url(#bloom)">
    <line x1="256" y1="210" x2="160" y2="150"/>
    <line x1="256" y1="210" x2="352" y2="150"/>
    <line x1="160" y1="150" x2="210" y2="85"/>
    <line x1="352" y1="150" x2="302" y2="85"/>
    <line x1="210" y1="85" x2="302" y2="85"/>
    <line x1="160" y1="150" x2="110" y2="210"/>
    <line x1="352" y1="150" x2="402" y2="210"/>
    <line x1="256" y1="210" x2="256" y2="330" stroke-dasharray="4,4"/>
  </g>

  <!-- Constellation Planetary Nodes -->
  <g filter="url(#bloom)">
    <!-- Top Central Star / AI Synthesis Spark -->
    <circle cx="256" cy="70" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="70" r="6" fill="#ffffff"/>

    <!-- Flanking Nodes -->
    <circle cx="210" cy="85" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="302" cy="85" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

    <!-- Mid Tier Hubs -->
    <circle cx="160" cy="150" r="13" fill="#0ea5e9" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="352" cy="150" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Center Nexus Node -->
    <circle cx="256" cy="210" r="18" fill="#6366f1" stroke="#ffffff" stroke-width="3"/>
    <circle cx="256" cy="210" r="8" fill="#ffffff"/>

    <!-- Outer Satellites -->
    <circle cx="110" cy="210" r="8" fill="#38bdf8"/>
    <circle cx="402" cy="210" r="8" fill="#34d399"/>
  </g>
</svg>
