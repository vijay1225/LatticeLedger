<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="sparkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Bold 4-Point Synthesis Flare / Organic Spark -->
  <path d="M 256 36 
           C 270 160, 352 242, 476 256 
           C 352 270, 270 352, 256 476 
           C 242 352, 160 270, 36 256 
           C 160 242, 242 160, 256 36 Z" 
        fill="url(#sparkGrad)" 
        filter="url(#sparkGlow)"/>

  <!-- Satellite Connection Spark (Quick Note Orbiter) -->
  <circle cx="390" cy="120" r="32" fill="url(#sparkGrad)"/>
  <circle cx="390" cy="120" r="16" fill="#ffffff"/>

  <!-- Glowing Core Center -->
  <circle cx="256" cy="256" r="64" fill="url(#sparkCore)"/>
  <circle cx="256" cy="256" r="28" fill="#ffffff"/>
</svg>
