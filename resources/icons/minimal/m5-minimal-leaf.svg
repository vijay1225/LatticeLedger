<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="minLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="minLeafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Elegant Minimalist Leaf Silhouette -->
  <path d="M 256 50 
           C 380 110, 440 230, 380 360 
           C 330 430, 240 460, 160 430 
           C 80 350, 70 240, 130 130 
           C 170 80, 210 52, 256 50 Z" 
        fill="url(#minLeafGrad)" 
        opacity="0.95"
        filter="url(#minLeafGlow)"/>

  <!-- Minimalist Negative-Space / White-Hot Central Stem -->
  <path d="M 160 430 Q 240 300 256 50" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Single Radiant Apex Synthesis Dewdrop -->
  <circle cx="256" cy="50" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="7"/>

  <!-- Single Root Anchor Dewdrop -->
  <circle cx="160" cy="430" r="22" fill="#ffffff" stroke="#ea580c" stroke-width="6"/>
</svg>
