<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Ribbon 1 -->
    <linearGradient id="ribbonGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Warm Ribbon 2 -->
    <linearGradient id="ribbonGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Bold Continuous Fluid Ribbon (Abstract Lattice L) -->
  <!-- Base Leg -->
  <path d="M 120 100 
           L 120 340 
           C 120 400, 160 440, 220 440 
           L 400 440" 
        stroke="url(#ribbonGrad1)" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#ribbonGlow)"/>

  <!-- Fold / Dynamic Diagonal Wing -->
  <path d="M 170 390 
           C 260 390, 390 320, 420 180 
           C 440 90, 360 60, 290 90 
           C 220 120, 180 200, 180 280" 
        stroke="url(#ribbonGrad2)" 
        stroke-width="48" 
        stroke-linecap="round" 
        fill="none"
        opacity="0.95"
        filter="url(#ribbonGlow)"/>

  <!-- Glowing Synthesis Accent Node -->
  <circle cx="290" cy="90" r="26" fill="#ffffff" stroke="#f59e0b" stroke-width="7"/>
</svg>
