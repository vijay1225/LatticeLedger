<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="infGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Elegant Infinity Knot / Knowledge Loop -->
  <path d="M 160 330 
           C 90 330, 60 256, 120 200 
           C 180 144, 230 200, 256 256 
           C 282 312, 332 368, 392 312 
           C 452 256, 422 182, 352 182 
           C 282 182, 232 240, 256 256 
           C 280 272, 330 330, 392 330" 
        stroke="url(#infGrad)" 
        stroke-width="54" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" 
        filter="url(#infGlow)"/>

  <!-- Synthesis Node at Center Intersection -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="7"/>
</svg>
