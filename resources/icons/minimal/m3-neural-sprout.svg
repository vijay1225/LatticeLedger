<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="sproutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Curved Organic Stem -->
  <path d="M 160 450 C 160 340, 210 240, 270 170" 
        stroke="#ea580c" 
        stroke-width="32" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Sleek Minimalist Teardrop Leaf -->
  <path d="M 270 170 
           C 270 70, 390 40, 430 50 
           C 440 90, 410 210, 310 210 
           C 285 210, 270 190, 270 170 Z" 
        fill="url(#sproutGrad)" 
        filter="url(#sproutGlow)"/>

  <!-- Left Small Satellite Petal (Quick Note Sprout) -->
  <path d="M 195 310 
           C 150 300, 100 240, 120 180 
           C 160 170, 200 220, 210 270 Z" 
        fill="#f97316" 
        opacity="0.9"/>

  <!-- Glowing Dewdrop Nodes -->
  <circle cx="430" cy="50" r="26" fill="#ffffff" stroke="#f59e0b" stroke-width="7"/>
  <circle cx="120" cy="180" r="18" fill="#ffffff" stroke="#f97316" stroke-width="5"/>
  <circle cx="160" cy="450" r="24" fill="#ffffff" stroke="#ea580c" stroke-width="6"/>
</svg>
