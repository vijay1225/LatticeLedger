<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zenLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="zenRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MINIMALIST ICON - NO BACKGROUND CONTAINER -->

  <!-- Left Petal of Zen Leaf (Warm Flame Coral) -->
  <path d="M 170 430 
           C 100 340, 80 200, 160 110 
           C 200 65, 260 45, 330 40 
           C 310 110, 260 250, 185 390 
           Z" 
        fill="url(#zenLeftGrad)" 
        filter="url(#zenGlow)"/>

  <!-- Right Petal of Zen Leaf (Sunburst Golden Amber) -->
  <path d="M 330 40 
           C 410 110, 440 250, 370 360 
           C 320 440, 240 470, 170 430 
           C 220 370, 270 230, 315 70 
           Z" 
        fill="url(#zenRightGrad)" 
        filter="url(#zenGlow)"/>

  <!-- Glowing Apex Synthesis Node -->
  <circle cx="330" cy="40" r="22" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>

  <!-- Base Anchor Node -->
  <circle cx="170" cy="430" r="18" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>
</svg>
