<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Orchid Gradients -->
    <linearGradient id="petalTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="petalLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="petalRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE BIO-SYMBOL - NO BOX -->

  <!-- Left Lower Petal -->
  <path d="M 256 280 C 180 340, 90 410, 110 320 C 130 230, 200 240, 256 280 Z" fill="url(#petalLeft)" opacity="0.9"/>
  <!-- Right Lower Petal -->
  <path d="M 256 280 C 332 340, 422 410, 402 320 C 382 230, 312 240, 256 280 Z" fill="url(#petalRight)" opacity="0.9"/>

  <!-- Left Main Wing Petal -->
  <path d="M 256 256 C 140 230, 40 180, 80 100 C 130 30, 210 160, 256 256 Z" fill="url(#petalLeft)" opacity="0.95"/>
  <!-- Right Main Wing Petal -->
  <path d="M 256 256 C 372 230, 472 180, 432 100 C 382 30, 302 160, 256 256 Z" fill="url(#petalRight)" opacity="0.95"/>

  <!-- Top Crown Petal (Central Ascension) -->
  <path d="M 256 256 C 210 150, 180 50, 256 36 C 332 50, 302 150, 256 256 Z" fill="url(#petalTop)" opacity="0.98" filter="url(#bloomGlow)"/>

  <!-- Inner Synaptic Branching Filaments (Stamen Lines) -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#bloomGlow)">
    <line x1="256" y1="256" x2="256" y2="80"/>
    <line x1="256" y1="256" x2="130" y2="120"/>
    <line x1="256" y1="256" x2="382" y2="120"/>
    <line x1="256" y1="256" x2="150" y2="350"/>
    <line x1="256" y1="256" x2="362" y2="350"/>
  </g>

  <!-- Glowing Stamen Anthers (Knowledge Pollen) -->
  <circle cx="256" cy="80" r="22" fill="#ffffff" stroke="#ec4899" stroke-width="6"/>
  <circle cx="130" cy="120" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="382" cy="120" r="18" fill="#ffffff" stroke="#f43f5e" stroke-width="5"/>
  <circle cx="150" cy="350" r="18" fill="#ffffff" stroke="#7c3aed" stroke-width="5"/>
  <circle cx="362" cy="350" r="18" fill="#ffffff" stroke="#c026d3" stroke-width="5"/>

  <!-- Central Golden Seed / Core -->
  <circle cx="256" cy="256" r="34" fill="#fbbf24" stroke="#ffffff" stroke-width="7" filter="url(#bloomGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
