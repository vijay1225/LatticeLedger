<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Strand 1: Warm Amber to Tangerine -->
    <linearGradient id="dnaStrand1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Strand 2: Cyan to Electric Azure -->
    <linearGradient id="dnaStrand2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="dnaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE BIO-SYMBOL - NO BOX -->

  <!-- Base-Pair Rungs (Connecting the 2 Strands of Thought) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95" filter="url(#dnaGlow)">
    <line x1="150" y1="90" x2="362" y2="90"/>
    <line x1="190" y1="160" x2="322" y2="160"/>
    <line x1="256" y1="230" x2="256" y2="230" stroke-width="24"/>
    <line x1="190" y1="300" x2="322" y2="300"/>
    <line x1="150" y1="370" x2="362" y2="370"/>
    <line x1="190" y1="440" x2="322" y2="440"/>
  </g>

  <!-- DNA Strand 1: Left-to-Right Sinusoidal Wave (Thick 36px) -->
  <path d="M 150 50 
           C 150 140, 362 140, 362 230 
           C 362 320, 150 320, 150 410 
           C 150 460, 200 480, 256 480" 
        fill="none" 
        stroke="url(#dnaStrand1)" 
        stroke-width="38" 
        stroke-linecap="round" 
        filter="url(#dnaGlow)"/>

  <!-- DNA Strand 2: Right-to-Left Complementary Sinusoidal Wave -->
  <path d="M 362 50 
           C 362 140, 150 140, 150 230 
           C 150 320, 362 320, 362 410 
           C 362 460, 312 480, 256 480" 
        fill="none" 
        stroke="url(#dnaStrand2)" 
        stroke-width="38" 
        stroke-linecap="round" 
        filter="url(#dnaGlow)"/>

  <!-- Nucleotide Nodes at Rung Terminals -->
  <circle cx="150" cy="90" r="22" fill="#ffffff" stroke="#f97316" stroke-width="6"/>
  <circle cx="362" cy="90" r="22" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
  <circle cx="256" cy="230" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="7" filter="url(#dnaGlow)"/>
  <circle cx="150" cy="370" r="22" fill="#ffffff" stroke="#ef4444" stroke-width="6"/>
  <circle cx="362" cy="370" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="6"/>
</svg>
