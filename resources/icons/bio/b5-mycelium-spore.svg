<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Coral-Amber Spore Cap -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Mycelium Root Glow -->
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="mycelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE BIO-SYMBOL - NO BOX -->

  <!-- Top Mushroom / Spore Cap (The Knowledge Vault Umbrella) -->
  <path d="M 68 250 
           C 68 120, 150 48, 256 48 
           C 362 48, 444 120, 444 250 
           C 444 270, 410 270, 390 250
           C 370 230, 340 230, 320 250
           C 300 270, 270 270, 256 250
           C 242 270, 212 270, 192 250
           C 172 230, 142 230, 122 250
           C 102 270, 68 270, 68 250 Z" 
        fill="url(#capGrad)" 
        filter="url(#mycelGlow)"/>

  <!-- Cap Bioluminescent Spots (White Nodes) -->
  <circle cx="256" cy="115" r="22" fill="#ffffff" opacity="0.95"/>
  <circle cx="160" cy="165" r="16" fill="#ffffff" opacity="0.95"/>
  <circle cx="352" cy="165" r="16" fill="#ffffff" opacity="0.95"/>
  <circle cx="210" cy="205" r="12" fill="#ffffff" opacity="0.95"/>
  <circle cx="302" cy="205" r="12" fill="#ffffff" opacity="0.95"/>

  <!-- Mycelium Root Network (Nature's Original Zettelkasten Web) -->
  <g stroke="url(#rootGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#mycelGlow)">
    <!-- Central Main Trunk -->
    <path d="M 256 250 L 256 360 Q 256 440 256 470" stroke-width="20" stroke="#ffffff"/>
    <!-- Left Branching Root Threads -->
    <path d="M 256 320 Q 180 340 120 420 Q 80 440 60 460"/>
    <path d="M 210 360 Q 150 420 160 470"/>
    <!-- Right Branching Root Threads -->
    <path d="M 256 320 Q 332 340 392 420 Q 432 440 452 460"/>
    <path d="M 302 360 Q 362 420 352 470"/>
  </g>

  <!-- Glowing Hyphae Spore Nodes at Root Tips -->
  <circle cx="60" cy="460" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="160" cy="470" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="256" cy="470" r="22" fill="#ffffff" stroke="#f59e0b" stroke-width="6" filter="url(#mycelGlow)"/>
  <circle cx="352" cy="470" r="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="5"/>
  <circle cx="452" cy="460" r="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="5"/>
</svg>
