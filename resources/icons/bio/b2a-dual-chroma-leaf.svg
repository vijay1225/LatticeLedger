<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Wing Gradient (Tangerine to Golden Amber) -->
    <linearGradient id="warmWing" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Cool Wing Gradient (Deep Sapphire to Electric Cyan) -->
    <linearGradient id="coolWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="dualGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE DUAL-CHROMA LEAF - NO BACKGROUND BOX -->

  <!-- Left Half of Leaf (WARM TANGERINE/AMBER WING) -->
  <path d="M 256 40 
           C 160 80, 50 180, 70 320 
           C 85 410, 160 450, 240 468 
           L 248 468 
           C 248 340, 252 180, 256 40 Z" 
        fill="url(#warmWing)" 
        filter="url(#dualGlow)"/>

  <!-- Right Half of Leaf (COOL CYAN/SAPPHIRE WING) -->
  <path d="M 256 40 
           C 352 80, 462 180, 442 320 
           C 427 410, 352 450, 272 468 
           L 264 468 
           C 264 340, 260 180, 256 40 Z" 
        fill="url(#coolWing)" 
        filter="url(#dualGlow)"/>

  <!-- Thick Pure White Glowing Central Stem (Spine) -->
  <line x1="256" y1="472" x2="256" y2="40" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        filter="url(#dualGlow)"/>

  <!-- Branching Veins - Bold & High Contrast for 24px Scale -->
  <!-- Left Warm Veins (Golden White) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="360" x2="135" y2="395"/>
    <line x1="256" y1="260" x2="110" y2="280"/>
    <line x1="256" y1="160" x2="145" y2="155"/>
  </g>

  <!-- Right Cool Veins (Ice White) -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="360" x2="377" y2="395"/>
    <line x1="256" y1="260" x2="402" y2="280"/>
    <line x1="256" y1="160" x2="367" y2="155"/>
  </g>

  <!-- High-Luminance Terminal Dewdrops / Nodes -->
  <!-- Apex Node (Synthesis Peak) -->
  <circle cx="256" cy="40" r="30" fill="#ffffff" stroke="#fbbf24" stroke-width="7" filter="url(#dualGlow)"/>
  
  <!-- Left Warm Tip Nodes -->
  <circle cx="135" cy="395" r="22" fill="#ffffff" stroke="#f97316" stroke-width="6"/>
  <circle cx="110" cy="280" r="22" fill="#ffffff" stroke="#f97316" stroke-width="6"/>
  <circle cx="145" cy="155" r="20" fill="#ffffff" stroke="#fbbf24" stroke-width="5"/>

  <!-- Right Cool Tip Nodes -->
  <circle cx="377" cy="395" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6"/>
  <circle cx="402" cy="280" r="22" fill="#ffffff" stroke="#00f2fe" stroke-width="6"/>
  <circle cx="367" cy="155" r="20" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>

  <!-- Base Anchor Node -->
  <circle cx="256" cy="472" r="26" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
</svg>
