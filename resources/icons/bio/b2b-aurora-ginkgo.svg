<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm-to-Cool Radial Fan Gradient -->
    <linearGradient id="auroraFan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE GINKGO FAN - NO BACKGROUND BOX -->

  <!-- Solid Ginkgo Canopy (Fan Silhouette with Central Notch) -->
  <path d="M 256 420 
           C 200 370, 70 340, 44 220 
           C 20 120, 100 56, 230 64 
           L 256 120 
           L 282 64 
           C 412 56, 492 120, 468 220 
           C 442 340, 312 370, 256 420 Z" 
        fill="url(#auroraFan)" 
        opacity="0.96"
        filter="url(#auroraGlow)"/>

  <!-- Thick Warm-to-Cool Radial Veins Fanning Outward -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#auroraGlow)">
    <!-- Central Notched Stem -->
    <path d="M 256 450 L 256 120" stroke-width="20"/>

    <!-- Left Fluted Veins -->
    <path d="M 256 360 Q 180 270 120 170"/>
    <path d="M 256 390 Q 120 320 65 240"/>
    <path d="M 256 330 Q 200 200 175 100"/>

    <!-- Right Fluted Veins -->
    <path d="M 256 360 Q 332 270 392 170"/>
    <path d="M 256 390 Q 392 320 447 240"/>
    <path d="M 256 330 Q 312 200 337 100"/>
  </g>

  <!-- High-Luminance Terminal Dewdrop Nodes -->
  <!-- Warm Base Root Node -->
  <circle cx="256" cy="450" r="28" fill="#ffffff" stroke="#ea580c" stroke-width="7" filter="url(#auroraGlow)"/>
  
  <!-- Central Notch Beacon -->
  <circle cx="256" cy="120" r="24" fill="#ffffff" stroke="#00f2fe" stroke-width="6"/>

  <!-- Cool Outer Fan Nodes -->
  <circle cx="175" cy="100" r="20" fill="#ffffff" stroke="#00f2fe" stroke-width="5"/>
  <circle cx="337" cy="100" r="20" fill="#ffffff" stroke="#00f2fe" stroke-width="5"/>
  <circle cx="120" cy="170" r="20" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="392" cy="170" r="20" fill="#ffffff" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="65" cy="240" r="22" fill="#ffffff" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="447" cy="240" r="22" fill="#ffffff" stroke="#06b6d4" stroke-width="6"/>
</svg>
