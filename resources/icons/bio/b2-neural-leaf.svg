<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald-Cyan Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE BIO-SYMBOL - NO BACKGROUND BOX -->

  <!-- Solid Organic Leaf Body (Tilted 45 Deg Dynamic Silhouette) -->
  <path d="M 256 42 
           C 390 100, 460 250, 390 390 
           C 330 450, 240 470, 150 440 
           C 70 360, 60 230, 120 120 
           C 160 70, 210 45, 256 42 Z" 
        fill="url(#leafGrad)" 
        opacity="0.95"
        filter="url(#leafGlow)"/>

  <!-- Thick White-Hot Central Stem (The Core Journal) -->
  <path d="M 150 440 Q 240 310 256 42" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#leafGlow)"/>

  <!-- Branching Secondary Veins (Bi-directional Wiki Links) -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Right Veins -->
    <path d="M 200 370 Q 280 340 360 365"/>
    <path d="M 230 270 Q 320 230 405 250"/>
    <path d="M 248 160 Q 320 130 380 145"/>

    <!-- Left Veins -->
    <path d="M 180 395 Q 120 370 95 340"/>
    <path d="M 215 310 Q 140 270 90 220"/>
    <path d="M 240 210 Q 160 170 120 115"/>
  </g>

  <!-- Glowing Knowledge Dewdrops / Spores at Tips -->
  <circle cx="256" cy="42" r="26" fill="#ffffff" stroke="#10b981" stroke-width="6" filter="url(#leafGlow)"/>
  <circle cx="405" cy="250" r="20" fill="#ffffff" stroke="#00f2fe" stroke-width="5"/>
  <circle cx="380" cy="145" r="18" fill="#ffffff" stroke="#10b981" stroke-width="5"/>
  <circle cx="90" cy="220" r="18" fill="#ffffff" stroke="#0284c7" stroke-width="5"/>
</svg>
