<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm to Cool Diagonal Gradient -->
    <linearGradient id="monsteraDual" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#ff7a00"/>
      <stop offset="60%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <filter id="monstGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE MONSTERA BIO-SYMBOL - NO BOX -->

  <!-- Solid Organic Monstera Leaf Silhouette -->
  <path d="M 256 36 
           C 380 90, 460 220, 430 350 
           C 400 440, 310 476, 240 476 
           C 160 476, 80 430, 56 330 
           C 30 200, 120 80, 256 36 Z" 
        fill="url(#monsteraDual)" 
        opacity="0.96"
        filter="url(#monstGlow)"/>

  <!-- Thick White-Hot Neural Stem -->
  <path d="M 240 476 Q 256 260 256 36" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#monstGlow)"/>

  <!-- Iconic Fenestrations / Cutouts (Knowledge Windows) with High Contrast -->
  <!-- Left Side Cutouts (Warm Side) -->
  <g fill="#090d16" stroke="#ffffff" stroke-width="8">
    <ellipse cx="170" cy="220" rx="42" ry="18" transform="rotate(-30 170 220)"/>
    <ellipse cx="150" cy="320" rx="36" ry="16" transform="rotate(-15 150 320)"/>
  </g>

  <!-- Right Side Cutouts (Cool Side) -->
  <g fill="#090d16" stroke="#ffffff" stroke-width="8">
    <ellipse cx="330" cy="210" rx="42" ry="18" transform="rotate(30 330 210)"/>
    <ellipse cx="340" cy="310" rx="36" ry="16" transform="rotate(15 340 310)"/>
  </g>

  <!-- High-Luminance Terminal Dewdrops / Nodes -->
  <circle cx="256" cy="36" r="28" fill="#ffffff" stroke="#00f2fe" stroke-width="7" filter="url(#monstGlow)"/>
  <circle cx="240" cy="476" r="26" fill="#ffffff" stroke="#ea580c" stroke-width="7"/>
  <circle cx="430" cy="350" r="22" fill="#ffffff" stroke="#00d2ff" stroke-width="6"/>
  <circle cx="56" cy="330" r="22" fill="#ffffff" stroke="#ff7a00" stroke-width="6"/>
</svg>
