<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant Warm Sunset Flame Gradient -->
    <linearGradient id="warmLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="20%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Warm Dewdrop Halo Gradient -->
    <radialGradient id="dewHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE STANDALONE BIO-SYMBOL - NO BACKGROUND BOX / 100% TRANSPARENT CANVAS -->

  <!-- Solid Organic Neural Leaf Body (Tilted 45 Deg Silhouette) -->
  <path d="M 256 42 
           C 390 100, 460 250, 390 390 
           C 330 450, 240 470, 150 440 
           C 70 360, 60 230, 120 120 
           C 160 70, 210 45, 256 42 Z" 
        fill="url(#warmLeafGrad)" 
        opacity="0.97"
        filter="url(#warmGlow)"/>

  <!-- Thick White-Hot Central Stem (The Core Journal Spine) -->
  <path d="M 150 440 Q 240 310 256 42" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        fill="none"
        filter="url(#warmGlow)"/>

  <!-- Branching Secondary Veins (Bi-directional Wiki Links) -->
  <g stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- Right Veins -->
    <path d="M 200 370 Q 280 340 360 365"/>
    <path d="M 230 270 Q 320 230 405 250"/>
    <path d="M 248 160 Q 320 130 380 145"/>

    <!-- Left Veins -->
    <path d="M 180 395 Q 120 370 95 340"/>
    <path d="M 215 310 Q 140 270 90 220"/>
    <path d="M 240 210 Q 160 170 120 115"/>
  </g>

  <!-- Luminous Knowledge Dewdrops / Spores at Tips -->
  <!-- Apex Synthesis Node -->
  <circle cx="256" cy="42" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="7" filter="url(#warmGlow)"/>
  
  <!-- Right Vein Tips -->
  <circle cx="405" cy="250" r="22" fill="#ffffff" stroke="#f97316" stroke-width="6"/>
  <circle cx="380" cy="145" r="20" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
  
  <!-- Left Vein Tips -->
  <circle cx="90" cy="220" r="20" fill="#ffffff" stroke="#ea580c" stroke-width="6"/>
  <circle cx="95" cy="340" r="18" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>

  <!-- Base Anchor Root Node -->
  <circle cx="150" cy="440" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="7"/>
</svg>
