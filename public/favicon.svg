<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="crispShield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65">
    <polygon points="256,28 454,142 454,370 256,484 58,370 58,142"/>
    <line x1="220" y1="180" x2="220" y2="330"/>
    <line x1="220" y1="330" x2="295" y2="330"/>
  </g>

  <!-- 1. Outer Hexagonal Lattice Frame (Maximized into the 512x512 Canvas) -->
  <polygon points="256,28 454,142 454,370 256,484 58,370 58,142" 
           stroke="#ffffff" 
           stroke-width="20" 
           fill="none" 
           stroke-linejoin="round"
           filter="url(#crispShield)"/>

  <!-- 6 Large Luminous Vertex Nodes -->
  <g fill="#ffffff" filter="url(#crispShield)">
    <circle cx="256" cy="28" r="24"/>
    <circle cx="454" cy="142" r="24"/>
    <circle cx="454" cy="370" r="24"/>
    <circle cx="256" cy="484" r="24"/>
    <circle cx="58" cy="370" r="24"/>
    <circle cx="58" cy="142" r="24"/>
  </g>

  <!-- 2. Three Stylized Orbiting Pencils -->
  <g transform="translate(182, 146) rotate(-35)" filter="url(#crispShield)">
    <path d="M -56 -14 C -68 -14, -70 14, -56 14 Z" fill="#ffffff"/>
    <rect x="-54" y="-14" width="8" height="28" fill="#000000"/>
    <rect x="-44" y="-14" width="70" height="28" fill="#ffffff" rx="2"/>
    <rect x="-40" y="-3.5" width="62" height="7" fill="#000000"/>
    <polygon points="26,-14 58,0 26,14" fill="#ffffff"/>
    <polygon points="42,-7 58,0 42,7" fill="#000000"/>
  </g>

  <g transform="translate(362, 256) rotate(90)" filter="url(#crispShield)">
    <path d="M -62 -14 C -74 -14, -76 14, -62 14 Z" fill="#ffffff"/>
    <rect x="-60" y="-14" width="8" height="28" fill="#000000"/>
    <rect x="-50" y="-14" width="76" height="28" fill="#ffffff" rx="2"/>
    <rect x="-46" y="-3.5" width="68" height="7" fill="#000000"/>
    <polygon points="26,-14 60,0 26,14" fill="#ffffff"/>
    <polygon points="44,-7 60,0 44,7" fill="#000000"/>
  </g>

  <g transform="translate(182, 366) rotate(35)" filter="url(#crispShield)">
    <polygon points="-60,0 -26,-14 -26,14" fill="#ffffff"/>
    <polygon points="-60,0 -44,-7 -44,7" fill="#000000"/>
    <rect x="-26" y="-14" width="76" height="28" fill="#ffffff" rx="2"/>
    <rect x="-22" y="-3.5" width="68" height="7" fill="#000000"/>
    <rect x="50" y="-14" width="8" height="28" fill="#000000"/>
    <path d="M 60 -14 C 72 -14, 74 14, 60 14 Z" fill="#ffffff"/>
  </g>

  <!-- 3. Central L Monogram -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#crispShield)">
    <line x1="220" y1="180" x2="220" y2="332"/>
    <line x1="220" y1="332" x2="296" y2="332"/>
  </g>

  <g fill="#ffffff" filter="url(#crispShield)">
    <circle cx="220" cy="180" r="18"/>
    <circle cx="220" cy="332" r="18"/>
    <circle cx="296" cy="332" r="18"/>
  </g>

  <path d="M 206 278 
           C 252 278, 298 252, 302 198 
           C 304 162, 274 162, 252 194 
           C 230 226, 224 280, 256 332" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#crispShield)"/>
</svg>
